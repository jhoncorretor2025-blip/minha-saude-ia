name: one-time-fix-report-script
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix embedded script closing tag
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = '<script src="./js/evolucao-v598.js?v=5.98"></script>'
          new = '<script src="./js/evolucao-v598.js?v=5.98"><\\/script>'
          if old not in s:
              raise SystemExit("Target string not found")
          if new in s:
              raise SystemExit("Already fixed")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: prevent report script from leaking into page"
          git push
